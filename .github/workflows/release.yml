# Builds a signed, notarized Termos.zip and publishes it as a GitHub release.
# Runs when a version tag is pushed:  git tag v0.2.0 && git push origin v0.2.0
#
# Repository secrets:
#   DEVELOPER_ID_P12           Developer ID Application certificate with its private key, as base64 of a .p12
#   DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   APPLE_ID                   Apple ID used for notarization
#   APPLE_APP_PASSWORD         app-specific password of that Apple ID
#   APPLE_TEAM_ID              team ID, e.g. RXNV5Y358G
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The macos-26 image has only Xcode 26; this preview image has Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Choose keychain path
        run: echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"

      # Universal builds need Xcode 27 (see scripts/bundle.sh). Pinned to a release:
      # the image defaults to 27.0 and also carries betas.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -t cert -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign looks the identity up in the user search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in DEVELOPER_ID_P12." >&2
            exit 1
          fi
          echo "TERMOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials termos \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          TERMOS_BUILD: ${{ github.run_number }}
        run: |
          export TERMOS_VERSION="${GITHUB_REF_NAME#v}"
          export TERMOS_NOTARY_KEYCHAIN="$KEYCHAIN"
          scripts/release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="build/Termos-${GITHUB_REF_NAME#v}.zip"
          cp build/Termos.zip "$ASSET"
          gh release create "$GITHUB_REF_NAME" "$ASSET" --title "Termos ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
